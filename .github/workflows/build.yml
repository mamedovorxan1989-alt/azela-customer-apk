name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | grep -o '".*"' | tr -d '"')
          cp app/build/outputs/apk/release/app-release.apk AZELA-Customer-v${VERSION}.apk
          echo "APK_FILE=AZELA-Customer-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AZELA Customer v${{ env.VERSION }}
          files: ${{ env.APK_FILE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "Yeni ikon - AZELA logo"
