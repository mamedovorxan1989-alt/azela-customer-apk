name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version=8.6 --distribution-type=bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AZELA-Customer.apk

      - name: Delete existing release if exists
        run: |
          gh release delete v2.0.6 --yes 2>/dev/null || true
          git push --delete origin v2.0.6 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.6
          name: AZELA Müştəri APK v2.0.6
          body: "AZELA Pro Müştəri tətbiqi — Android üçün"
          files: AZELA-Customer.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
